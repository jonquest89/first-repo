<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Common Thread</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  :root{
    --paper:#F5F4EE;
    --paper-raised:#FDFCF8;
    --ink:#1C2033;
    --ink-soft:#5A5E70;
    --rule:#C9C7BC;
    --accent:#2742C9;
    --accent-ink:#FDFCF8;
    --gold:#C9930A;
    --gold-soft:#F3E4BC;
    --green:#2F7D4F;
    --green-ink:#FDFCF8;
    --red:#B23A3A;
    --tile-empty:#E9E7DE;
    --key:#FDFCF8;
    --key-ink:#1C2033;
    --key-border:#C9C7BC;
    --shadow:0 1px 2px rgba(28,32,51,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#14161F;
      --paper-raised:#1E2130;
      --ink:#ECEAE2;
      --ink-soft:#9A9DB0;
      --rule:#383C50;
      --accent:#7D90F5;
      --accent-ink:#14161F;
      --gold:#E3B84A;
      --gold-soft:#3A3320;
      --green:#4CAE78;
      --green-ink:#14161F;
      --red:#E07A7A;
      --tile-empty:#262A3B;
      --key:#2A2E42;
      --key-ink:#ECEAE2;
      --key-border:#3B4058;
      --shadow:0 1px 2px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --paper:#F5F4EE; --paper-raised:#FDFCF8; --ink:#1C2033; --ink-soft:#5A5E70;
    --rule:#C9C7BC; --accent:#2742C9; --accent-ink:#FDFCF8; --gold:#C9930A;
    --gold-soft:#F3E4BC; --green:#2F7D4F; --green-ink:#FDFCF8; --red:#B23A3A;
    --tile-empty:#E9E7DE; --key:#FDFCF8; --key-ink:#1C2033; --key-border:#C9C7BC;
    --shadow:0 1px 2px rgba(28,32,51,.10);
  }
  :root[data-theme="dark"]{
    --paper:#14161F; --paper-raised:#1E2130; --ink:#ECEAE2; --ink-soft:#9A9DB0;
    --rule:#383C50; --accent:#7D90F5; --accent-ink:#14161F; --gold:#E3B84A;
    --gold-soft:#3A3320; --green:#4CAE78; --green-ink:#14161F; --red:#E07A7A;
    --tile-empty:#262A3B; --key:#2A2E42; --key-ink:#ECEAE2; --key-border:#3B4058;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100dvh;
    overflow:hidden;
    touch-action:manipulation;
  }
  #app{
    width:100%; max-width:480px;
    min-height:100dvh; max-height:100dvh;
    display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top, 0px) + 10px) 14px calc(env(safe-area-inset-bottom, 0px) + 10px);
  }

  /* ---------- Masthead ---------- */
  header{
    text-align:center;
    border-bottom:3px double var(--rule);
    padding-bottom:8px;
    flex:0 0 auto;
  }
  .masthead{
    font-family:"Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    font-size:clamp(22px, 6.5vw, 30px);
    font-weight:700;
    letter-spacing:.01em;
    line-height:1.1;
    margin:0;
    text-wrap:balance;
  }
  .masthead .plus{ color:var(--accent); }
  .dateline{
    display:flex; justify-content:center; gap:10px;
    font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-soft); margin-top:4px;
    font-variant-numeric:tabular-nums;
  }
  .dateline > span + span::before{ content:"·"; margin-right:10px; color:var(--rule); }

  /* ---------- Tier tabs ---------- */
  .tiers{
    display:flex; justify-content:center; gap:6px;
    padding:8px 0 2px;
    flex:0 0 auto;
  }
  .tab{
    appearance:none; cursor:pointer;
    background:none; border:1px solid var(--rule);
    color:var(--ink-soft);
    border-radius:999px;
    padding:5px 14px;
    font-size:11px; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase;
  }
  .tab.active{
    background:var(--accent); border-color:var(--accent);
    color:var(--accent-ink);
  }
  .tab .done-mark{ color:var(--gold); }
  .tab.active .done-mark{ color:var(--accent-ink); }
  .tab:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- Score strip ---------- */
  .strip{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:6px 2px 4px;
    font-size:11px; color:var(--ink-soft);
    letter-spacing:.06em; text-transform:uppercase;
    font-variant-numeric:tabular-nums;
    flex:0 0 auto;
  }
  .strip b{ color:var(--ink); font-size:14px; letter-spacing:0; }
  .strip .streak-on b{ color:var(--gold); }

  /* ---------- Clue card ---------- */
  main{
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; justify-content:space-evenly;
    gap:3px;
  }
  .prompt{
    text-align:center; font-size:13px; color:var(--ink-soft);
    font-style:italic;
    font-family:"Iowan Old Style", Palatino, Georgia, serif;
    margin:0;
  }
  #clues{
    display:flex; flex-direction:column; gap:7px;
  }
  .clue{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:6px;
    box-shadow:var(--shadow);
    padding:9px 12px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:clamp(17px, 5vw, 22px);
    font-weight:600;
    letter-spacing:.04em;
  }
  .clue .word{ text-transform:uppercase; }
  .clue .slot{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:1.5em; height:1.5em;
    padding:0 .3em;
    border-radius:5px;
    background:var(--accent);
    color:var(--accent-ink);
    font-size:.85em;
    font-weight:800;
    transition:background .3s;
  }
  .clue.solved .slot{ background:var(--green); color:var(--green-ink); }
  .clue.given .slot{ background:var(--red); color:var(--accent-ink); }

  /* ---------- Answer tiles ---------- */
  #answer{
    display:flex; justify-content:center; gap:6px;
    padding:2px 0;
  }
  .tile{
    width:clamp(34px, 10.5vw, 50px);
    aspect-ratio:1;
    border-radius:6px;
    background:var(--tile-empty);
    border:2px solid transparent;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(19px, 5.5vw, 26px);
    font-weight:800;
    text-transform:uppercase;
    color:var(--ink);
    transition:transform .12s, background .2s, border-color .2s;
  }
  .tile.filled{ border-color:var(--ink-soft); background:var(--paper-raised); transform:scale(1.04); }
  .tile.hinted{ background:var(--gold-soft); border-color:var(--gold); color:var(--gold); }
  .tile.correct{ background:var(--green); border-color:var(--green); color:var(--green-ink); }
  .tile.given{ background:var(--paper-raised); border-color:var(--red); color:var(--red); }
  @keyframes flip{
    0%{ transform:rotateX(0); }
    50%{ transform:rotateX(90deg); }
    100%{ transform:rotateX(0); }
  }
  .tile.flip{ animation:flip .45s ease both; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
  }
  #answer.shake{ animation:shake .4s ease; }
  @media (prefers-reduced-motion: reduce){
    .tile.flip, #answer.shake{ animation:none; }
    .tile.filled{ transform:none; }
  }

  /* ---------- Message + actions ---------- */
  #message{
    text-align:center; min-height:20px;
    font-size:14px; font-weight:600;
  }
  #message.win{ color:var(--green); }
  #message.err{ color:var(--red); }
  .actions{
    display:flex; justify-content:center; gap:8px;
    flex:0 0 auto;
  }
  .btn{
    appearance:none; border:1px solid var(--rule);
    background:var(--paper-raised); color:var(--ink);
    border-radius:999px;
    padding:9px 16px;
    font-size:12px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .btn:active{ transform:translateY(1px); }
  .btn:focus-visible, .key:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn.hint{ color:var(--gold); border-color:var(--gold); }
  .btn.reveal{ color:var(--red); border-color:var(--red); }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn[disabled]{ opacity:.4; cursor:default; }

  /* ---------- Keyboard ---------- */
  #keyboard{
    flex:0 0 auto;
    display:flex; flex-direction:column; gap:6px;
    padding-top:8px;
    user-select:none; -webkit-user-select:none;
  }
  .krow{ display:flex; justify-content:center; gap:5px; }
  .key{
    appearance:none; border:1px solid var(--key-border);
    background:var(--key); color:var(--key-ink);
    border-radius:5px;
    flex:1 1 0; max-width:42px;
    height:46px;
    font-size:16px; font-weight:700;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .key.wide{ max-width:66px; flex:1.6 1 0; font-size:12px; letter-spacing:.05em; }
  .key:active{ background:var(--tile-empty); transform:translateY(1px); }

  /* ---------- Tier-complete overlay ---------- */
  #done{
    position:fixed; inset:0;
    background:var(--paper);
    display:none;
    flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px;
  }
  #done.show{ display:flex; }
  #done h2{
    font-family:"Iowan Old Style", Palatino, Georgia, serif;
    font-size:30px; margin:0;
  }
  #done p{ color:var(--ink-soft); max-width:36ch; margin:0; line-height:1.5; }
  #done .actions{ flex-wrap:wrap; }
</style>

</head>
<body>
<div id="app">
  <header>
    <h1 class="masthead">The Common<span class="plus"> + </span>Thread</h1>
    <div class="dateline">
      <span id="tiername">Easy edition</span>
      <span>Puzzle <span id="pnum">1</span> of <span id="ptotal">40</span></span>
    </div>
  </header>

  <div class="tiers" role="tablist" aria-label="Difficulty">
    <button class="tab" data-tier="easy" role="tab">Easy</button>
    <button class="tab" data-tier="medium" role="tab">Medium</button>
    <button class="tab" data-tier="hard" role="tab">Hard</button>
  </div>

  <div class="strip">
    <span class="streak-wrap">Streak <b id="streak">0</b></span>
    <span>Solved <b id="solvedCount">0</b></span>
    <span>Time <b id="clock">0:00</b></span>
  </div>

  <main>
    <p class="prompt">One word completes all three&hellip;</p>
    <div id="clues" aria-live="polite"></div>
    <div id="answer" aria-label="Your answer"></div>
    <div id="message" role="status"></div>
    <div class="actions">
      <button class="btn hint" id="hintBtn">Hint&nbsp;+0:30</button>
      <button class="btn reveal" id="revealBtn">Reveal</button>
      <button class="btn" id="skipBtn">Skip</button>
      <button class="btn primary" id="nextBtn" style="display:none">Next&nbsp;&rarr;</button>
    </div>
  </main>

  <div id="keyboard" aria-label="Keyboard"></div>
</div>

<div id="done">
  <h2 id="doneTitle">Edition complete!</h2>
  <p id="doneStats"></p>
  <p id="doneNote"></p>
  <div class="actions">
    <button class="btn" id="replayBtn">Replay</button>
    <button class="btn primary" id="nextTierBtn">Next edition &rarr;</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* Each puzzle: a = answer, d = difficulty tier, c = three [clueWord, side]
   pairs. side "before" = clue word comes before the answer (GOAT+),
   side "after" = clue word comes after the answer (+STICK).
   The bank is validated by tools/validate-puzzles.mjs (structure +
   dictionary collision scan). Run it after editing this list. */
var PUZZLES = [
  { a:"CHEESE", d:"easy", c:[["STICK","after"],["GOAT","before"],["WHEEL","after"]] },
  { a:"FIRE",   d:"easy", c:[["CAMP","before"],["WORKS","after"],["FLY","after"]] },
  { a:"WATER",  d:"easy", c:[["FALL","after"],["SALT","before"],["MELON","after"]] },

  { a:"HORSE",  d:"easy", c:[["SEA","before"],["SHOE","after"],["POWER","after"]] },
  { a:"BOARD",  d:"easy", c:[["SKATE","before"],["KEY","before"],["SURF","before"]] },
  { a:"HOUSE",  d:"easy", c:[["BIRD","before"],["GREEN","before"],["PLANT","after"]] },
  { a:"BOX",    d:"easy", c:[["SAND","before"],["MAIL","before"],["LUNCH","before"]] },
  { a:"PAPER",  d:"easy", c:[["NEWS","before"],["WALL","before"],["CLIP","after"]] },
  { a:"BED",    d:"easy", c:[["TIME","after"],["ROOM","after"],["BUNK","before"]] },

  { a:"MILK",   d:"easy", c:[["SHAKE","after"],["BUTTER","before"],["COCONUT","before"]] },
  { a:"SHIP",   d:"easy", c:[["FRIEND","before"],["WRECK","after"],["SPACE","before"]] },
  { a:"RING",   d:"easy", c:[["EAR","before"],["TONE","after"],["BOXING","before"]] },

  { a:"POT",    d:"medium", c:[["JACK","before"],["TEA","before"],["HOLE","after"]] },

  { a:"SAND",   d:"medium", c:[["CASTLE","after"],["PAPER","after"],["QUICK","before"]] },
  { a:"GUARD",  d:"medium", c:[["BODY","before"],["LIFE","before"],["RAIL","after"]] },
  { a:"PROOF",  d:"medium", c:[["BULLET","before"],["FOOL","before"],["WATER","before"]] },
  { a:"BRUSH",  d:"medium", c:[["PAINT","before"],["HAIR","before"],["FIRE","after"]] },

  { a:"BREAK",  d:"hard", c:[["FAST","after"],["DAY","before"],["OUT","before"]] },
  { a:"CHECK",  d:"hard", c:[["MATE","after"],["RAIN","before"],["PAY","before"]] },
  { a:"DOUBLE", d:"hard", c:[["CROSS","after"],["TAKE","after"],["BODY","before"]] },
  { a:"COLD",   d:"hard", c:[["SHOULDER","after"],["FRONT","after"],["TURKEY","after"]] },

  { a:"SHOT",   d:"hard", c:[["MUG","before"],["LONG","before"],["SLING","before"]] },
  { a:"TRAP",   d:"hard", c:[["MOUSE","before"],["DOOR","after"],["TOURIST","before"]] },
  { a:"RUN",    d:"hard", c:[["HOME","before"],["WAY","after"],["OFF","after"]] },
  { a:"MARK",   d:"hard", c:[["TRADE","before"],["BENCH","before"],["QUESTION","before"]] },
  { a:"WISE",   d:"hard", c:[["CLOCK","before"],["CRACK","after"],["STREET","before"]] },
  { a:"STAND",  d:"hard", c:[["GRAND","before"],["NEWS","before"],["STILL","after"]] },
  { a:"TALK",   d:"hard", c:[["SMALL","before"],["PEP","before"],["SHOW","after"]] },
  { a:"LIFE",   d:"hard", c:[["WILD","before"],["NIGHT","before"],["SHELF","before"]] },
  { a:"TIME",   d:"hard", c:[["LIFE","before"],["OVER","before"],["ZONE","after"]] },
  { a:"POINT",  d:"hard", c:[["PIN","before"],["BLANK","after"],["VIEW","before"]] },
  { a:"CUT",    d:"hard", c:[["SHORT","before"],["BACK","after"],["PAPER","before"]] },
  { a:"TRACK",  d:"hard", c:[["SUIT","after"],["SOUND","before"],["SIDE","before"]] },
  { a:"WHEEL",  d:"hard", c:[["BARROW","after"],["FERRIS","before"],["CART","before"]] },
  { a:"NECK",   d:"hard", c:[["BOTTLE","before"],["TURTLE","before"],["LACE","after"]] },
  { a:"SLIP",   d:"hard", c:[["KNOT","after"],["PINK","before"],["COVER","after"]] },
  { a:"SPIN",   d:"hard", c:[["OFF","after"],["TAIL","before"],["CYCLE","after"]] },
  { a:"STRING", d:"hard", c:[["SHOE","before"],["BEAN","after"],["HAM","before"]] },
  { a:"BELT",   d:"hard", c:[["CONVEYOR","before"],["BLACK","before"],["SEAT","before"]] },
  { a:"CHIP",   d:"hard", c:[["MUNK","after"],["POKER","before"],["BLUE","before"]] },
  { a:"DRESS",  d:"hard", c:[["SUN","before"],["HEAD","before"],["REHEARSAL","after"]] },
  { a:"MATCH",  d:"hard", c:[["BOX","after"],["MAKER","after"],["TENNIS","before"]] },
  { a:"PICK",   d:"hard", c:[["TOOTH","before"],["NIT","before"],["ICE","before"]] },
  { a:"PLANT",  d:"hard", c:[["POWER","before"],["EGG","before"],["HOUSE","before"]] },
  { a:"SCREEN", d:"hard", c:[["SAVER","after"],["SMOKE","before"],["TOUCH","before"]] },
  { a:"WASH",   d:"hard", c:[["BRAIN","before"],["CLOTH","after"],["MOUTH","before"]] },
  { a:"TIP",    d:"hard", c:[["TOE","after"],["FINGER","before"],["OFF","after"]] },
  { a:"HORN",   d:"hard", c:[["FOG","before"],["LONG","before"],["SHOE","before"]] },
  { a:"WEIGHT", d:"hard", c:[["PAPER","before"],["HEAVY","before"],["LIFTING","after"]] },
  { a:"FALL",   d:"hard", c:[["NIGHT","before"],["PIT","before"],["OUT","after"]] }
];

var TIER_ORDER = ["easy", "medium", "hard"];
var TIER_LABEL = { easy:"Easy edition", medium:"Medium edition", hard:"Hard edition" };
var BANK = { easy:[], medium:[], hard:[] };
PUZZLES.forEach(function(p){ BANK[p.d].push(p); });

/* Seconds added to a puzzle's solve time for the 1st, 2nd, 3rd hint. Any
   hint beyond the third keeps the last (largest) penalty. */
var HINT_PENALTIES = [30, 45, 60];

var STORE_KEY = "commonthread-v3";

function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && s.idx && s.tierTime && TIER_ORDER.indexOf(s.tier) !== -1) return s;
  }catch(e){}
  return { tier:"easy", idx:{easy:0, medium:0, hard:0}, streak:0, solved:0,
           tierTime:{easy:0, medium:0, hard:0} };
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

var state = loadState();

var guess = [];        // player letters, null = empty
var locked = [];       // true where a hint revealed the letter
var over = false;      // solved or revealed — puzzle finished
var hintsUsed = 0;     // hints taken this puzzle
var penaltyMs = 0;     // time penalty (ms) added by hints this puzzle
var startedAt = 0;     // timer start for this puzzle
var clockTimer = null;

var $ = function(id){ return document.getElementById(id); };
var cluesEl = $("clues"), answerEl = $("answer"), msgEl = $("message");
var hintBtn = $("hintBtn"), revealBtn = $("revealBtn"),
    skipBtn = $("skipBtn"), nextBtn = $("nextBtn");

function bank(){ return BANK[state.tier]; }
function puzzle(){ return bank()[state.idx[state.tier]]; }
function tierDone(){ return state.idx[state.tier] >= bank().length; }

function fmtTime(ms){
  var s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function elapsedMs(){ return (Date.now() - startedAt) + penaltyMs; }
function stopClock(){ if (clockTimer){ clearInterval(clockTimer); clockTimer = null; } }
function startClock(){
  stopClock();
  startedAt = Date.now();
  $("clock").textContent = "0:00";
  clockTimer = setInterval(function(){
    $("clock").textContent = fmtTime(elapsedMs());
  }, 500);
}

function renderHUD(){
  $("tiername").textContent = TIER_LABEL[state.tier];
  $("pnum").textContent = Math.min(state.idx[state.tier] + 1, bank().length);
  $("ptotal").textContent = bank().length;
  $("streak").textContent = state.streak;
  $("solvedCount").textContent = state.solved;
  document.querySelector(".streak-wrap").classList.toggle("streak-on", state.streak >= 3);
  document.querySelectorAll(".tab").forEach(function(tab){
    var t = tab.dataset.tier;
    tab.classList.toggle("active", t === state.tier);
    tab.setAttribute("aria-selected", t === state.tier);
    tab.innerHTML = t.charAt(0).toUpperCase() + t.slice(1) +
      (state.idx[t] >= BANK[t].length ? ' <span class="done-mark">&#10003;</span>' : "");
  });
}

function renderClues(mode){ // mode: "play" | "solved" | "given"
  cluesEl.innerHTML = "";
  puzzle().c.forEach(function(pair){
    var row = document.createElement("div");
    row.className = "clue" + (mode === "solved" ? " solved" : mode === "given" ? " given" : "");
    var slot = document.createElement("span");
    slot.className = "slot";
    slot.textContent = mode === "play" ? "+" : puzzle().a;
    var word = document.createElement("span");
    word.className = "word";
    word.textContent = pair[0];
    if (pair[1] === "before"){ row.appendChild(word); row.appendChild(slot); }
    else { row.appendChild(slot); row.appendChild(word); }
    cluesEl.appendChild(row);
  });
}

function renderAnswer(){
  answerEl.innerHTML = "";
  var a = puzzle().a;
  for (var i = 0; i < a.length; i++){
    var t = document.createElement("div");
    t.className = "tile";
    if (locked[i]){ t.classList.add("hinted","filled"); t.textContent = a[i]; }
    else if (guess[i]){ t.classList.add("filled"); t.textContent = guess[i]; }
    answerEl.appendChild(t);
  }
}

function setMessage(text, kind){
  msgEl.textContent = text || "";
  msgEl.className = kind || "";
}

function nextPenaltySec(){
  return HINT_PENALTIES[Math.min(hintsUsed, HINT_PENALTIES.length - 1)];
}
function updateHintBtn(){
  var unrevealed = locked.filter(function(x){ return !x; }).length;
  hintBtn.disabled = unrevealed <= 1;
  hintBtn.innerHTML = "Hint&nbsp;+" + fmtTime(nextPenaltySec() * 1000);
}

function startPuzzle(){
  if (tierDone()){ showDone(); return; }
  $("done").classList.remove("show");
  var a = puzzle().a;
  guess = new Array(a.length).fill(null);
  locked = new Array(a.length).fill(false);
  over = false;
  hintsUsed = 0;
  penaltyMs = 0;
  nextBtn.style.display = "none";
  hintBtn.style.display = "";
  revealBtn.style.display = "";
  skipBtn.style.display = "";
  setMessage("");
  renderHUD();
  renderClues("play");
  renderAnswer();
  updateHintBtn();
  startClock();
}

function firstEmpty(){
  for (var i = 0; i < guess.length; i++)
    if (!locked[i] && !guess[i]) return i;
  return -1;
}
function lastFilled(){
  for (var i = guess.length - 1; i >= 0; i--)
    if (!locked[i] && guess[i]) return i;
  return -1;
}

function typeLetter(ch){
  if (over) return;
  var i = firstEmpty();
  if (i === -1) return;
  guess[i] = ch;
  renderAnswer();
}
function backspace(){
  if (over) return;
  var i = lastFilled();
  if (i === -1) return;
  guess[i] = null;
  setMessage("");
  renderAnswer();
}

function currentWord(){
  var a = puzzle().a, out = "";
  for (var i = 0; i < a.length; i++){
    var ch = locked[i] ? a[i] : guess[i];
    if (!ch) return null;
    out += ch;
  }
  return out;
}

function check(){
  if (over) return;
  var w = currentWord();
  if (!w){ setMessage("Fill in every letter first.", "err"); return; }
  if (w === puzzle().a){ win(); }
  else {
    state.streak = 0;
    saveState(); renderHUD();
    setMessage("Not the one — try again.", "err");
    answerEl.classList.remove("shake");
    void answerEl.offsetWidth;
    answerEl.classList.add("shake");
  }
}

function endPuzzle(){
  over = true;
  stopClock();
  hintBtn.style.display = "none";
  revealBtn.style.display = "none";
  skipBtn.style.display = "none";
  nextBtn.style.display = "";
  nextBtn.textContent = (state.idx[state.tier] + 1 < bank().length) ? "Next →" : "Finish edition";
}

function win(){
  var solveMs = elapsedMs();
  state.streak += 1;
  state.solved += 1;
  state.tierTime[state.tier] += solveMs;
  saveState();
  endPuzzle();
  renderHUD();
  var tiles = answerEl.children;
  var a = puzzle().a;
  for (var i = 0; i < tiles.length; i++){
    (function(t, ch, d){
      setTimeout(function(){
        t.classList.remove("hinted");
        t.classList.add("correct","flip");
        t.textContent = ch;
      }, d);
    })(tiles[i], a[i], i * 90);
  }
  setTimeout(function(){ renderClues("solved"); }, a.length * 90 + 200);
  var note = penaltyMs ? " (incl. " + fmtTime(penaltyMs) + " hint penalty)" : "";
  setMessage(praise() + " Solved in " + fmtTime(solveMs) + note + ".", "win");
}

function praise(){
  var lines = ["Threaded it!","Sharp as newsprint!","Front-page material!","Hot off the press!","A real wordsmith!"];
  return lines[state.solved % lines.length];
}

function reveal(){
  if (over) return;
  state.streak = 0;
  saveState();
  endPuzzle();
  renderHUD();
  var tiles = answerEl.children;
  var a = puzzle().a;
  for (var i = 0; i < tiles.length; i++){
    tiles[i].className = "tile filled given";
    tiles[i].textContent = a[i];
  }
  renderClues("given");
  setMessage("The thread was " + a + " — streak reset.", "err");
}

function hint(){
  if (over) return;
  var a = puzzle().a;
  var spots = [];
  for (var i = 0; i < a.length; i++) if (!locked[i]) spots.push(i);
  if (spots.length <= 1) return;
  /* First hint anchors the word with its first letter; later hints
     reveal a random remaining letter so repeat hints stay interesting.
     Each hint adds a time penalty (streak is untouched — only a wrong
     guess breaks a streak). */
  var pick = hintsUsed === 0 && !locked[0]
    ? 0
    : spots[Math.floor(Math.random() * spots.length)];
  penaltyMs += nextPenaltySec() * 1000;
  hintsUsed += 1;
  locked[pick] = true;
  guess[pick] = null;
  $("clock").textContent = fmtTime(elapsedMs());
  renderAnswer();
  updateHintBtn();
}

function advance(){
  state.idx[state.tier] += 1;
  saveState();
  if (tierDone()){ showDone(); } else { startPuzzle(); }
}

function skip(){
  state.streak = 0;
  saveState();
  stopClock();
  advance();
}

function showDone(){
  stopClock();
  renderHUD();
  var t = state.tier;
  $("doneTitle").textContent = "Extra! Extra!";
  $("doneStats").textContent = TIER_LABEL[t] + " complete · Total time " + fmtTime(state.tierTime[t]);
  var nextTier = TIER_ORDER[TIER_ORDER.indexOf(t) + 1];
  $("doneNote").textContent = nextTier
    ? "Ready for the " + nextTier + " edition, or replay this one?"
    : "You finished the hardest edition. Replay any tier from the tabs above.";
  $("nextTierBtn").style.display = nextTier ? "" : "none";
  $("replayBtn").textContent = "Replay " + t;
  $("done").classList.add("show");
}

function setTier(t){
  state.tier = t;
  saveState();
  $("done").classList.remove("show");
  startPuzzle();
}

/* ---------- keyboard ---------- */
var ROWS = ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
var kb = $("keyboard");
ROWS.forEach(function(row, ri){
  var r = document.createElement("div");
  r.className = "krow";
  if (ri === 2){
    r.appendChild(makeKey("ENTER", "wide", check));
  }
  row.split("").forEach(function(ch){
    r.appendChild(makeKey(ch, "", function(){ typeLetter(ch); }));
  });
  if (ri === 2){
    r.appendChild(makeKey("⌫", "wide", backspace, "Backspace"));
  }
  kb.appendChild(r);
});
function makeKey(label, cls, fn, aria){
  var k = document.createElement("button");
  k.type = "button";
  k.className = "key" + (cls ? " " + cls : "");
  k.textContent = label;
  if (aria) k.setAttribute("aria-label", aria);
  k.addEventListener("click", fn);
  return k;
}

document.addEventListener("keydown", function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if ($("done").classList.contains("show")) return;
  /* preventDefault so Enter doesn't also re-activate whichever button
     still holds focus (e.g. a tier tab clicked moments earlier). */
  if (e.key === "Enter"){ e.preventDefault(); over ? advance() : check(); }
  else if (e.key === "Backspace"){ e.preventDefault(); backspace(); }
  else if (/^[a-zA-Z]$/.test(e.key)){ typeLetter(e.key.toUpperCase()); }
});

hintBtn.addEventListener("click", hint);
revealBtn.addEventListener("click", reveal);
skipBtn.addEventListener("click", skip);
nextBtn.addEventListener("click", advance);
$("replayBtn").addEventListener("click", function(){
  state.idx[state.tier] = 0;
  state.tierTime[state.tier] = 0;
  saveState();
  $("done").classList.remove("show");
  startPuzzle();
});
$("nextTierBtn").addEventListener("click", function(){
  var next = TIER_ORDER[TIER_ORDER.indexOf(state.tier) + 1];
  if (next) setTier(next);
});
document.querySelectorAll(".tab").forEach(function(tab){
  tab.addEventListener("click", function(){ setTier(tab.dataset.tier); });
});

startPuzzle();
})();
</script>

</body>
</html>
